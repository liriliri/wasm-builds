name: Publish to NPM

run-name: Publish ${{ github.event.inputs.package }} to NPM

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  publish:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - run: |
          npm i -g npm@11.19.0
          npm i
          cd packages/${{ github.event.inputs.package }}
          npm run build
          npm publish
